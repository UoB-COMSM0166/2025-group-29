<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop Page</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; font-family:'Minecraft',Arial,sans-serif; }
    #bgFrame { position:absolute; top:0; left:0; width:100vw; height:100vh; border:none; z-index:0; pointer-events:none; }
    .menuContainer { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.8); color:#fff; padding:20px; border-radius:8px; max-width:90%; text-align:center; z-index:1; }
    #header { display:flex; justify-content:space-between; align-items:center; }
    .menuButton { background:rgba(255,255,255,0.1); border:2px solid #fff; color:#fff; padding:6px 12px; border-radius:4px; cursor:pointer; }
    .menuButton:hover { background:rgba(255,255,255,0.2); }
    #shop { display:flex; gap:8px; margin:12px 0; }
    .column { flex:1; display:flex; flex-direction:column; background:#222; border:2px solid #555; border-radius:4px; padding:6px; }
    .column.active { box-shadow:0 0 8px rgba(0,255,0,0.7); }
    .item { flex:1; margin:4px 0; padding:6px; background:#333; color:#fff; border:1px solid #666; border-radius:4px; cursor:pointer; user-select:none; }
    .item.disabled { background:#111; color:#777; cursor:not-allowed; }
    #storedSection { margin-top:12px; }
    #storedList { list-style:none; padding:0; }
    #storedList li { padding:4px 0; border-bottom:1px solid #444; color:#fff; }
  </style>
</head>
<body>

  <!-- 背景动画 -->
  <iframe id="bgFrame" src="BG.html?auto=true"></iframe>

  <div class="menuContainer" id="shopPanel">
    <div id="header">
      <span id="levelDisplay">Level: 0</span>
      <button class="menuButton" id="resetBtn">Reset</button>
    </div>

    <div id="shop">
      <div class="column agile" data-col="0">
        <div class="item" data-row="0">Phantom Dash</div>
        <div class="item" data-row="1">Ghost Cutter</div>
        <div class="item" data-row="2">Runner’s Instinct</div>
      </div>
      <div class="column tank" data-col="1">
        <div class="item" data-row="0">Iron Reversal</div>
        <div class="item" data-row="1">Anchor Field</div>
        <div class="item" data-row="2">Guardian’s Will</div>
      </div>
      <div class="column power" data-col="2">
        <div class="item" data-row="0">Crimson Drain</div>
        <div class="item" data-row="1">Wrath Unchained</div>
        <div class="item" data-row="2">Berserker’s Blood</div>
      </div>
    </div>

    <div id="storedSection">
      <h3>Stored Skills</h3>
      <ul id="storedList"><li>None</li></ul>
    </div>

    <button class="menuButton" id="backToGame">Continue</button>
  </div>

  <script type="module" src="js/shop.js"></script>
