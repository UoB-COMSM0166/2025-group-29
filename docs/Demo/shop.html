<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop Page</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000; font-family:'Minecraft',Arial,sans-serif; }
    #bgFrame { position:absolute; top:0; left:0; width:100vw; height:100vh; border:none; z-index:0; pointer-events:none; }
    .menuContainer { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.8); color:#fff; padding:20px; border-radius:8px; max-width:90%; text-align:center; z-index:1; }
    #header { display:flex; justify-content:space-between; align-items:center; }
    .menuButton { background:rgba(255,255,255,0.1); border:2px solid #fff; color:#fff; padding:6px 12px; border-radius:4px; cursor:pointer; }
    .menuButton:hover { background:rgba(255,255,255,0.2); }
    #shop { display:flex; gap:8px; margin:12px 0; }
    .column { flex:1; display:flex; flex-direction:column; background:#222; border:2px solid #555; border-radius:4px; padding:6px; }
    .column.active { box-shadow:0 0 8px rgba(0,255,0,0.7); }
    .item { flex:1; margin:4px 0; padding:6px; background:#333; color:#fff; border:1px solid #666; border-radius:4px; cursor:pointer; user-select:none; }
    .item.disabled { background:#111; color:#777; cursor:not-allowed; }
    #storedSection { margin-top:12px; }
    #storedList { list-style:none; padding:0; }
    #storedList li { padding:4px 0; border-bottom:1px solid #444; color:#fff; }
  </style>
</head>
<body>

  <!-- 背景动画 -->
  <iframe id="bgFrame" src="BG.html?auto=true"></iframe>

  <div class="menuContainer" id="shopPanel">
    <div id="header">
      <span id="levelDisplay">Level: 0</span>
      <button class="menuButton" id="resetBtn">Reset</button>
    </div>

    <div id="shop">
      <div class="column agile"    data-col="0">
        <div class="item" data-row="0">Agile – Skill 1</div>
        <div class="item" data-row="1">Agile – Skill 2</div>
        <div class="item" data-row="2">Agile – Passive</div>
      </div>
      <div class="column tank"     data-col="1">
        <div class="item" data-row="0">Tank – Skill 1</div>
        <div class="item" data-row="1">Tank – Skill 2</div>
        <div class="item" data-row="2">Tank – Passive</div>
      </div>
      <div class="column strength" data-col="2">
        <div class="item" data-row="0">Strength – Skill 1</div>
        <div class="item" data-row="1">Strength – Skill 2</div>
        <div class="item" data-row="2">Strength – Passive</div>
      </div>
    </div>

    <div id="storedSection">
      <h3>Stored Skills</h3>
      <ul id="storedList"><li>None</li></ul>
    </div>

    <button class="menuButton" id="backToGame">Continue</button> <!-- ★ 新增 -->
  </div>

  <script type="module">
    // 直接引入 Supabase 客户端
    import { supabase } from './js/supabase.js';

    // 读取 URL 中的 saveId
    const params  = new URLSearchParams(window.location.search);
    const saveId  = params.get('saveId');
    if (!saveId) { alert('缺少存档 ID'); throw new Error('saveId required'); }

    /* ─── 本地状态 ─── */
    let level = 0, chosenCol = null;
    let stored = [];                       // 已选技能
    const MAX = 3;
    const attrNames = ['Agile','Tank','Strength'];

    /* ─── DOM ─── */
    const lvlDisplay  = document.getElementById('levelDisplay');
    const resetBtn    = document.getElementById('resetBtn');
    const shop        = document.getElementById('shop');
    const storedList  = document.getElementById('storedList');
    const backBtn     = document.getElementById('backToGame');  // ★ 新增

    function renderStored() {
      storedList.innerHTML = stored.length
        ? stored.map(n => `<li>${n}</li>`).join('')
        : '<li>None</li>';
    }

    function updateUI() {
      lvlDisplay.textContent = 'Level: ' + level;
      document.querySelectorAll('.column').forEach(colEl => {
        const col = +colEl.dataset.col;
        colEl.classList.toggle('active', col === chosenCol);
        colEl.querySelectorAll('.item').forEach(item => {
          const row  = +item.dataset.row;
          const name = item.textContent;
          item.classList.remove('disabled');
          if (
            level >= 2 ||
            stored.includes(name) ||
            stored.length >= MAX ||
            (level === 0 && row !== 0) ||
            (level === 1 && row === 2) ||
            (level === 1 && stored.length === 1 && col !== chosenCol && stored.some(n => n.startsWith(attrNames[col]))) ||
            (level === 1 && stored.length === 2 && (col === chosenCol || stored.some(n => n.startsWith(attrNames[col]))))
          ) {
            item.classList.add('disabled');
          }
        });
      });
      renderStored();
    }

    /* ─── Supabase 读存档 ─── */
    async function loadSave() {
      const { data, error } = await supabase
        .from('saves')
        .select('current_level, skills')
        .eq('id', saveId)
        .single();
      if (error) return alert('加载失败: ' + error.message);

      level  = data.current_level;
      stored = data.skills || [];
      if (stored.length) {
        const first = stored[0];
        chosenCol = attrNames.findIndex(a => first.startsWith(a));
      }
      updateUI();
    }

    /* ─── 写回存档 ─── */
    async function saveState() {
      await supabase
        .from('saves')
        .update({ current_level: level, skills: stored })
        .eq('id', saveId);
    }

    /* ─── 点击技能格 ─── */
    shop.addEventListener('click', e => {
      const it = e.target.closest('.item');
      if (!it || it.classList.contains('disabled')) return;

      const col  = +it.parentElement.dataset.col;
      const row  = +it.dataset.row;
      const name = it.textContent;

      if (level === 0) {
        stored.push(name); chosenCol = col; level = 1;
      } else if (level === 1) {
        if (stored.length === 1 && col === chosenCol) {
          stored.push(name);
          stored.push(`${attrNames[col]} – Passive`);
          level = 2;
        } else if (stored.length < MAX && col !== chosenCol) {
          stored.push(name);
          if (stored.length === MAX) level = 2;
        }
      }

      updateUI();
      saveState();
    });

    /* ─── Reset ─── */
    resetBtn.addEventListener('click', async () => {
      level = 0; chosenCol = null; stored = [];
      updateUI();
      await supabase
        .from('saves')
        .update({ current_level: 0, skills: [] })
        .eq('id', saveId);
    });

    /* ─── Continue 按钮：保存 → 回游戏 ─── */
    backBtn.addEventListener('click', async () => {          // ★ 新增
      await saveState();
      window.location.href = `game.html?saveId=${saveId}`;
    });

    /* ─── 启动 ─── */
    loadSave();
  </script>
</body>
</html>
