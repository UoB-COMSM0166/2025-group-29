<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pixelated Space Demo</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      height: 100%;
      width: 100%;
      font-family: 'Minecraft', Arial, sans-serif;
    }

    #introOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.8s ease;
    }
    #introOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #introImage {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.6s ease;
    }
    #introImage.fade {
      opacity: 0;
    }

    /* 右下角点击提示 */
    #clickText {
      position: absolute;
      right: 1em; bottom: 1em;
      color: #fff;
      font-size: 1.5em;
      user-select: none;
      pointer-events: none;
      text-shadow: 2px 2px 4px #000;
    }

    /* 底部居中字幕 */
    #storyText {
      position: absolute;
      left: 50%; bottom: 5%;
      transform: translateX(-50%);
      width: 80%;
      color: #fff;
      font-size: 2em;
      line-height: 1.4em;
      text-align: center;
      white-space: pre-wrap;
      pointer-events: none;
      text-shadow: 2px 2px 4px #000;
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="introOverlay">
    <img id="introImage" src="assets/media/intro/1.png" alt="Intro"/>
    <div id="clickText">Click to continue</div>
    <div id="storyText"></div>
  </div>

  <div id="canvas-container"></div>
  <script type="module" src="js/app.js"></script>
  <script src="js/intro.js"></script>
</body>
</html>
