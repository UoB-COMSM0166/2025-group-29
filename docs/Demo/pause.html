<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Pause Menu</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body{margin:0;background:rgba(0,0,0,0.9);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Minecraft',Arial,sans-serif}
    h1{margin-bottom:20px}
    button{margin:10px;padding:10px 20px;font-size:1.2em;cursor:pointer}
  </style>
</head>
<body>
  <h1>Game Paused</h1>
  <button onclick="parent.postMessage({type:'pause_action',action:'resume'},'*')">Resume</button>
  <button onclick="parent.postMessage({type:'pause_action',action:'save'},'*')">Save</button>
  <button onclick="parent.postMessage({type:'pause_action',action:'quit'},'*')">Quit</button>
</body>
</html>
