<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixelated Space Background</title>
    <style>
        @font-face {
            font-family: 'Minecraft';
            src: url('/docs/media/font/minecraft.ttf') format('truetype');
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Minecraft', Arial, sans-serif;
        }
        canvas {
            display: block;
        }
        /* 标题图片：居中，上方10%，放大1.25倍 */
        #titleImage {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%) scale(1.25);
            max-width: 400px;
            z-index: 3;
            mix-blend-mode: lighten;
            will-change: transform;
        }
        /* 按任意键继续文本，字体略小、正常粗细 */
        #continueText {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            font-weight: normal;
            color: white;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
            font-family: 'Minecraft', Arial, sans-serif;
            z-index: 3;
            will-change: transform;
        }
        /* 选择菜单 - 居中显示 */
        #selectionMenu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            text-align: center;
            font-size: 24px;
            font-family: 'Minecraft', Arial, sans-serif;
            padding: 20px;
            display: none;
            z-index: 3;
            border-radius: 8px;
        }
        /* 按钮样式 */
        .menuButton {
            width: 100%;
            margin: 10px 0;
            padding: 12px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #fff;
            border-radius: 4px;
            font-size: 20px;
            font-family: 'Minecraft', Arial, sans-serif;
            color: white;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        .menuButton:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
        }
    </style>
    <!-- three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- 标题图片 -->
    <img id="titleImage" src="/docs/media/start_menu/titled-3.png" alt="Title Image" />
    <!-- 按任意键继续文本 -->
    <div id="continueText">Press any key to continue</div>
    <!-- 选择菜单：读取存档 / 开始新游戏 / 退出游戏 -->
    <div id="selectionMenu">
        <button class="menuButton" id="loadButton">Load Game</button>
        <button class="menuButton" id="newButton">Start New Game</button>
        <button class="menuButton" id="exitButton">Exit Game</button>
    </div>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        // 创建星星
        function createStar(x, y, z) {
            const geometry = new THREE.SphereGeometry(1, 12, 12);
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const star = new THREE.Mesh(geometry, material);
            star.position.set(x, y, z);
            scene.add(star);
            return star;
        }
        const stars = [];
        for (let i = 0; i < 1500; i++) {
            stars.push(createStar(
                Math.random() * 600 - 300,
                Math.random() * 600 - 300,
                Math.random() * -1200 - 50
            ));
        }
        camera.position.z = 5;
        let phase = 0;
        let t = 0;
        const flightDuration = 5; // 5秒
        function animate() {
            requestAnimationFrame(animate);
            if (phase === 0) {
                camera.position.x = Math.sin(Date.now() * 0.0005) * 10;
                camera.position.z = Math.cos(Date.now() * 0.0005) * 10;
                camera.lookAt(0, 0, -50);
            } else if (phase === 1) {
                t += 1 / (flightDuration * 60);
                let easedSpeed = easeInOutQuad(t) * 10;
                camera.position.z -= easedSpeed;
                camera.lookAt(0, 0, -50);
                if (t >= 1) {
                    phase = 2;
                    document.getElementById('selectionMenu').style.display = 'block';
                }
            }
            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
        // 任意键继续：开始飞行到中间
        window.addEventListener('keydown', () => {
            document.getElementById('continueText').style.display = 'none';
            phase = 1;
            t = 0;
        });
        // 按钮事件
        document.getElementById('loadButton').addEventListener('click', () => {
            // TODO: 实现读取存档逻辑
            console.log('Load Game clicked');
        });
        document.getElementById('newButton').addEventListener('click', () => {
            // TODO: 实现新游戏逻辑
            window.location.href = '../index.html';
        });
        document.getElementById('exitButton').addEventListener('click', () => {
            // 退出游戏：关闭窗口或返回上级
            window.close();
        });
        function easeInOutQuad(time) {
            return (time < 0.5) ? 2 * time * time : -1 + (4 - 2 * time) * time;
        }
        // 视差效果
        const titleImage = document.getElementById('titleImage');
        const continueText = document.getElementById('continueText');
        const parallaxRange = 20;
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX - window.innerWidth / 2) / window.innerWidth;
            const y = (e.clientY - window.innerHeight / 2) / window.innerHeight;
            titleImage.style.transform = `translateX(calc(-50% + ${-x * parallaxRange}px)) translateY(${-y * parallaxRange}px) scale(1.25)`;
            continueText.style.transform = `translateX(calc(-50% + ${x * parallaxRange * 1.5}px)) translateY(${y * parallaxRange * 1.5}px)`;
        });
    </script>
</body>
</html>
