<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixelated Space Background</title>
    <style>
        @font-face {
            font-family: 'Minecraft';
            src: url('/docs/media/font/minecraft.ttf') format('truetype');
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Minecraft', Arial, sans-serif;
        }

        canvas {
            display: block;
        }

        #startButton, #finalStartButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 80px;
            background: url('/docs/media/start_menu/start.png') no-repeat center center;
            background-size: cover;
            border: none;
            cursor: pointer;
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            font-family: 'Minecraft', Arial, sans-serif;
            color: white;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }

        #startButton:hover, #finalStartButton:hover {
            opacity: 0.8;
        }

        #selectionMenu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 200px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            text-align: center;
            font-size: 24px;
            font-family: 'Minecraft', Arial, sans-serif;
            padding: 20px;
            display: none;
            z-index: 3;
        }

        #finalStartButton {
            margin-top: 20px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <button id="startButton">Start</button>
    <div id="selectionMenu">
        <p>Select Your Options:</p>
        <button id="finalStartButton">Start Game</button>
    </div>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        function createStar(x, y, z) {
            const geometry = new THREE.SphereGeometry(1, 12, 12);
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const star = new THREE.Mesh(geometry, material);
            star.position.set(x, y, z);
            scene.add(star);
            return star;
        }

        const stars = [];
        for (let i = 0; i < 800; i++) {
            stars.push(createStar(
                Math.random() * 600 - 300, 
                Math.random() * 600 - 300, 
                Math.random() * -1200 - 50
            ));
        }

        camera.position.z = 5;
        let gameStarted = false;
        let phase = 0;
        let t = 0;
        let flightDuration = 5;  // Extended flight duration (5 seconds per phase)

        function animate() {
            requestAnimationFrame(animate);

            if (phase === 0) {
                camera.position.x = Math.sin(Date.now() * 0.0005) * 10;
                camera.position.z = Math.cos(Date.now() * 0.0005) * 10;
                camera.lookAt(0, 0, -50);
            } else if (phase === 1) {
                t += 1 / (flightDuration * 60);  // Slow down transition (frames)
                let easedSpeed = easeInOutQuad(t) * 10;  // Lower max speed
                camera.position.z -= easedSpeed;
                if (t >= 1) {
                    phase = 2;
                    document.getElementById("selectionMenu").style.display = "block";
                }
            } else if (phase === 3) {
                t += 1 / (flightDuration * 60);
                let easedSpeed = easeInOutQuad(t) * 10;
                camera.position.z -= easedSpeed;
                if (t >= 1) {
                    window.location.href = "../index.html";
                }
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });

        document.getElementById("startButton").addEventListener("click", () => {
            document.getElementById("startButton").style.display = "none";
            gameStarted = true;
            phase = 1;
            t = 0;
        });

        document.getElementById("finalStartButton").addEventListener("click", () => {
            document.getElementById("selectionMenu").style.display = "none";
            phase = 3;
            t = 0;
        });

        function easeInOutQuad(t) {
            return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        }
    </script>

</body>
</html>
